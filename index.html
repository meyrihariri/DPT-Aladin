      // Gracefully filter benign Vite HMR websocket reconnection notices in sandboxed container preview
      (function() {
        if (typeof window === 'undefined') return;
        var origError = console.error;
        var origWarn = console.warn;

        function isViteBenign(arg) {
          if (!arg) return false;
          if (typeof arg === 'string') {
            return arg.indexOf('[vite]') !== -1 ||
                   arg.indexOf('failed to connect to websocket') !== -1 ||
                   arg.indexOf('WebSocket closed without opened') !== -1 ||
                   arg.indexOf('vite-hmr') !== -1 ||
                   arg.indexOf('vite-ping') !== -1 ||
                   arg.indexOf('@vite/client') !== -1;
          }
          if (typeof arg === 'object') {
            // Check if it's an Event or WebSocket error event
            if (arg.type === 'error') {
              if (arg.target && (arg.target instanceof WebSocket || String(arg.target.url || '').indexOf('vite') !== -1 || String(arg.target.url || '').indexOf('24678') !== -1)) {
                return true;
              }
            }
            var text = '' + (arg.message || '') + ' ' + (arg.stack || '') + ' ' + (arg.name || '');
            if (arg.reason) {
              text += ' ' + (arg.reason.message || arg.reason.stack || String(arg.reason));
            }
            return text.indexOf('[vite]') !== -1 ||
                   text.indexOf('failed to connect to websocket') !== -1 ||
                   text.indexOf('WebSocket closed without opened') !== -1 ||
                   text.indexOf('vite-hmr') !== -1 ||
                   text.indexOf('vite-ping') !== -1 ||
                   text.indexOf('@vite/client') !== -1;
          }
          return false;
        }

        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteBenign(arguments[i])) return;
          }
          return origError.apply(console, arguments);
        };

        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteBenign(arguments[i])) return;
          }
          return origWarn.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (!event) return;
          if (isViteBenign(event.reason) || (event.reason && (event.reason.type === 'error' || (event.reason.target && event.reason.target instanceof WebSocket)))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (!event) return;
          if (isViteBenign(event.message) || isViteBenign(event.error) || (event.filename && event.filename.indexOf('@vite/client') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
